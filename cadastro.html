<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>📝 Cadastro</h1>
      <p class="subtitle">Crie sua conta</p>

      <form id="cadastroForm">
        <div class="input-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="input-group">
          <label for="emailCadastro">Email</label>
          <input type="email" id="emailCadastro" placeholder="Digite seu e-mail">
        </div>

        <div class="input-group">
          <label for="senhaCadastro">Senha</label>
          <input type="password" id="senhaCadastro" placeholder="Crie uma senha">
        </div>

        <div class="input-group">
          <label for="confirmarSenha">Confirmar Senha</label>
          <input type="password" id="confirmarSenha" placeholder="Repita a senha">
        </div>

        <button type="button" onclick="validarCadastro()">Cadastrar</button>
        <p id="mensagemCadastro"></p>
      </form>

      <p class="link-baixo">
        Já tem conta? <a href="index.html">Fazer login</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
